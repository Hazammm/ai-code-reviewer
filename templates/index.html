<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeLens — AI Code Reviewer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🔍 CodeLens</h1>
      <p>AI-Powered Code Review with Claude</p>
    </header>

    <div class="main">
      <!-- Input Panel -->
      <div class="panel input-panel">
        <h2>Paste Your Code</h2>
        
        <div class="controls">
          <select id="language" class="select">
            {% for lang in languages %}
              <option value="{{ lang }}">{{ lang }}</option>
            {% endfor %}
          </select>

          <select id="focus" class="select">
            {% for value, label in focus_options %}
              <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
          </select>
        </div>

        <textarea id="code-input" placeholder="Paste your code here..."></textarea>

        <div class="actions">
          <button onclick="loadExample()" class="btn secondary">Load Example</button>
          <button onclick="submitReview()" class="btn primary" id="review-btn">
            <span id="btn-text">Review with Claude</span>
            <span id="loading" class="hidden">Reviewing...</span>
          </button>
        </div>
      </div>

      <!-- Result Panel -->
      <div class="panel result-panel" id="result-panel">
        <div class="result-header">
          <h2>AI Code Review</h2>
          <div class="meta">
            <span id="model-info"></span>
            <span id="token-info"></span>
          </div>
        </div>
        
        <div id="review-content" class="review-content"></div>

        <div class="result-actions">
          <button onclick="copyReview()" class="btn secondary">Copy Review</button>
          <button onclick="clearReview()" class="btn secondary">New Review</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
