<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CodeLens — AI Code Reviewer</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">Code<span>Lens</span></div>
    <span class="badge">Flask + Claude</span>
  </header>

  <div class="workspace">

    <!-- INPUT PANEL -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title"><span class="dot"></span> Your Code</span>
        <span class="char-count" id="char-count">0 / 10,000</span>
      </div>

      <div class="controls">
        <select id="language">
          {% for lang in languages %}
          <option value="{{ lang }}">{{ lang }}</option>
          {% endfor %}
        </select>

        <select id="focus">
          {% for value, label in focus_options %}
          <option value="{{ value }}">{{ label }}</option>
          {% endfor %}
        </select>
      </div>

      <textarea id="code-input" placeholder="# Paste your code here..."></textarea>

      <button class="review-btn" id="review-btn" onclick="reviewCode()">
        ✦ Review My Code
      </button>
    </div>

    <!-- OUTPUT PANEL -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">⬡ Analysis</span>
        <span class="badge" id="status-badge">Idle</span>
      </div>

      <div id="output">
        <div class="placeholder-msg">
          <div class="icon">⬡</div>
          <p>Paste your code on the left and hit Review to get an AI-powered analysis.</p>
        </div>
      </div>

      <div class="stats-bar" id="stats-bar" style="display:none">
        <div class="stat">Tokens used: <span class="stat-val" id="stat-tokens">—</span></div>
        <div class="stat">Time: <span class="stat-val" id="stat-time">—</span></div>
      </div>
    </div>

  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
